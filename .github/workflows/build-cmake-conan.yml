name: reVC conan+cmake
on:
  pull_request:
  push:
  release:
    types: published
  workflow_dispatch:
jobs:
  build-cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'windows-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
          - os: 'windows-latest'
            platform: 'd3d9'
            audio: 'openal'
          - os: 'ubuntu-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
          - os: 'macos-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'ps2' || matrix.gl3_gfxlib == 'sdl2' || matrix.audio == 'miles' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: "Test standalone modern feature policies"
        if: runner.os == 'Linux'
        run: |
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/gps_path_search.cpp -o /tmp/gps_path_search
          /tmp/gps_path_search
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/modern_visual_policy.cpp -o /tmp/modern_visual_policy
          /tmp/modern_visual_policy
          python3 tests/test_scene_load_contract.py
          INCLUDES=$(find src -type d -printf ' -I%p')
          c++ -w -std=c++11 -pthread -ffunction-sections -fdata-sections \
            -DANDROID -DRW_GL3 -DLIBRW_SDL2 -DLIBRW -Itests/android_stubs \
            $INCLUDES -Ivendor/librw -Ivendor/sdl2/include tests/android_cdstream.cpp \
            -Wl,--gc-sections -o /tmp/android_cdstream
          timeout 30 /tmp/android_cdstream
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/modern_postfx_policy.cpp -o /tmp/modern_postfx_policy
          /tmp/modern_postfx_policy
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/gl_framebuffer_mates.cpp -o /tmp/gl_framebuffer_mates
          /tmp/gl_framebuffer_mates
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/modern_bloom_plan.cpp -o /tmp/modern_bloom_plan
          /tmp/modern_bloom_plan
          python3 tests/modern_bloom_reference.py
          c++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined -g tests/modern_lighting_policy.cpp -o /tmp/modern_lighting_policy
          /tmp/modern_lighting_policy
      - name: "Checkout Miles SDK Import Library project"
        uses: actions/checkout@v4
        if: ${{ matrix.audio == 'miles' }}
        with:
          repository: 'withmorten/re3mss'
          path: 're3mss'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: "Install Linux system dependencies"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libgl-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libx11-dev libx11-xcb-dev libfontenc-dev libice-dev libsm-dev libxau-dev libxaw7-dev \
            libxcomposite-dev libxcursor-dev libxdamage-dev libxdmcp-dev libxext-dev libxfixes-dev \
            libxi-dev libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev \
            libxpm-dev libxrandr-dev libxrender-dev libxres-dev libxss-dev libxt-dev libxtst-dev \
            libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render0-dev \
            libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-dri3-dev uuid-dev libxcb-cursor-dev libxcb-dri2-0-dev \
            libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev
      - name: "Setup conan"
        run: |
          python -m pip install "conan>=2.1"
          conan profile detect --force
      - name: "Export librw conan recipe"
        run: |
          conan export vendor/librw
      - name: "Export Miles SDK conan recipe"
        if: ${{ matrix.audio == 'miles' }}
        run: |
          conan export re3mss --name=miles-sdk --version=master
      - name: "Download/build dependencies (conan install)"
        shell: bash
        run: |
          GFXLIB_OPT=""
          if [ "${{ matrix.platform }}" = "gl3" ]; then
            GFXLIB_OPT="-o librw/*:gl3_gfxlib=${{ matrix.gl3_gfxlib || 'glfw' }}"
          fi
          set -o pipefail
          conan install . \
            --output-folder=build \
            -o "&:audio=${{ matrix.audio }}" \
            -o "librw/*:platform=${{ matrix.platform }}" \
            ${GFXLIB_OPT} \
            --build=missing \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -s build_type=RelWithDebInfo 2>&1 | tee install.log || {
            ERRS=$(grep -iE "ERROR:|fatal error|CMake Error|not found|failed" install.log | tail -n 5 | tr '\n' ' ')
            echo "::error::conan install failed: ${ERRS}"
            exit 1
          }
      - name: "Build reVC (conan build)"
        shell: bash
        run: |
          GFXLIB_OPT=""
          if [ "${{ matrix.platform }}" = "gl3" ]; then
            GFXLIB_OPT="-o librw/*:gl3_gfxlib=${{ matrix.gl3_gfxlib || 'glfw' }}"
          fi
          set -o pipefail
          conan build . \
            --output-folder=build \
            -o "&:audio=${{ matrix.audio }}" \
            -o "librw/*:platform=${{ matrix.platform }}" \
            ${GFXLIB_OPT} \
            -s build_type=RelWithDebInfo 2>&1 | tee build.log || {
            ERRS=$(grep -iE "fatal error|error C[0-9]+|error LNK[0-9]+|CMake Error|undefined reference|error:" build.log | head -n 5 | tr '\n' ' ')
            echo "::error::Build failed: ${ERRS}"
            exit 1
          }
      - name: "Create binary package (cpack)"
        working-directory: ./build
        run: |
          cpack -C RelWithDebInfo
      - name: "Archive binary package (github artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}-${{ matrix.platform }}"
          path: build/*.tar.xz
          if-no-files-found: error
