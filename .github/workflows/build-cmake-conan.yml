name: reVC conan+cmake
on:
  pull_request:
  push:
  release:
    types: published
  workflow_dispatch:
jobs:
  build-cmake:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: 'windows-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
          - os: 'windows-latest'
            platform: 'd3d9'
            audio: 'openal'
          - os: 'ubuntu-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
          - os: 'macos-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'ps2' || matrix.gl3_gfxlib == 'sdl2' || matrix.audio == 'miles' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: "Checkout Miles SDK Import Library project"
        uses: actions/checkout@v4
        if: ${{ matrix.audio == 'miles' }}
        with:
          repository: 'withmorten/re3mss'
          path: 're3mss'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: "Install Linux system dependencies"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev libasound2-dev
      - name: "Setup conan"
        run: |
          python -m pip install "conan>=2.1"
          conan profile detect --force
      - name: "Export librw conan recipe"
        run: |
          conan export vendor/librw
      - name: "Export Miles SDK conan recipe"
        if: ${{ matrix.audio == 'miles' }}
        run: |
          conan export re3mss --name=miles-sdk --version=master
      - name: "Download/build dependencies (conan install)"
        shell: bash
        run: |
          GFXLIB_OPT=""
          if [ "${{ matrix.platform }}" = "gl3" ]; then
            GFXLIB_OPT="-o librw/*:gl3_gfxlib=${{ matrix.gl3_gfxlib || 'glfw' }}"
          fi
          conan install . \
            --output-folder=build \
            -o "&:audio=${{ matrix.audio }}" \
            -o "librw/*:platform=${{ matrix.platform }}" \
            ${GFXLIB_OPT} \
            --build=missing \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True \
            -s build_type=RelWithDebInfo
      - name: "Build reVC (conan build)"
        run: |
          conan build . --output-folder=build -s build_type=RelWithDebInfo
      - name: "Create binary package (cpack)"
        working-directory: ./build
        run: |
          cpack -C RelWithDebInfo
      - name: "Archive binary package (github artifacts)"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}-${{ matrix.platform }}"
          path: build/*.tar.xz
          if-no-files-found: error
