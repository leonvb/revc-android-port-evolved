name: Validate modern shaders
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  glsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Validate desktop GL and GLES shader source
        run: python3 tests/test_modern_shaders.py
  hlsl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile D3D9 shader model 3
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe not found' }
          & $fxc.FullName /nologo /T ps_3_0 /E main /Fo modernAA_PS.cso src/extras/shaders/modernAA_PS.hlsl
          if ($LASTEXITCODE -ne 0) { throw 'HLSL compilation failed' }
          $built = (Get-FileHash modernAA_PS.cso -Algorithm SHA256).Hash
          $checkedIn = (Get-FileHash src/extras/shaders/obj/modernAA_PS.cso -Algorithm SHA256).Hash
          if ($built -ne $checkedIn) { throw 'Committed D3D9 shader bytecode differs from the compiled HLSL' }
          foreach ($shader in @('modernBloom', 'modernFXAA')) {
            & $fxc.FullName /nologo /T ps_3_0 /E main /Fo "$($shader)_PS.cso" "src/extras/shaders/$($shader)_PS.hlsl"
            if ($LASTEXITCODE -ne 0) { throw "$shader HLSL compilation failed" }
            $built = (Get-FileHash "$($shader)_PS.cso" -Algorithm SHA256).Hash
            $checkedIn = (Get-FileHash "src/extras/shaders/obj/$($shader)_PS.cso" -Algorithm SHA256).Hash
            if ($built -ne $checkedIn) { throw "$shader bytecode differs from the compiled HLSL" }
          }
      - name: Compile world lighting SM3 and expose temporary bytecode
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($stage in @('VS', 'PS')) {
            $target = if ($stage -eq 'VS') { 'vs_3_0' } else { 'ps_3_0' }
            & $fxc.FullName /nologo /T $target /E main /Fo "modernWorld_$stage.cso" "src/extras/shaders/modernWorld_$stage.hlsl"
            if ($LASTEXITCODE -ne 0) { throw "Modern world $stage compilation failed" }
            $data = [Convert]::ToBase64String([IO.File]::ReadAllBytes("modernWorld_$stage.cso"))
            $chunks = [Math]::Ceiling($data.Length / 2000.0)
            for ($i = 0; $i -lt $chunks; $i++) {
              $part = $data.Substring($i * 2000, [Math]::Min(2000, $data.Length - $i * 2000))
              Write-Output "::notice title=modernWorld_$stage part $i of $chunks::$part"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: modern-d3d9-shaders
          path: modernAA_PS.cso
          if-no-files-found: error
